<!DOCTYPE html>
<html>

<head>
    <title>My Planet Card</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f4ff;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #ff5a43;
        }

        p {
            color: #555;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            border: 3px solid #ff5a43;
            border-radius: 12px;
            padding: 20px;
            width: 200px;
        }

        .planet-name {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }

        .planet-fact {
            color: #666;
            margin-top: 10px;
            font-size: 14px;
        }

        button {
            background: #ff5a43;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h1>My Planet Card</h1>
    <p>Use a Javascript class to build planet cards!</p>
    <button onclick="showPlanets()">Show Planets!</button>
    <div class="cards">
        <div id="card1"></div>
        <div id="card2"></div>
        <div id="card3"></div>
    </div>
    <script>
        class Superhero {
            constructor(name, fact) {
                this.name = name;
                this.fact = fact;
            }
            describe() {
                return this.name + ": " + this.fact;
            }
        }

        function showSuperhero() {
            let p1 = new Superhero("Spiderman", "He was the first major teen hero who wasn't a sidekick");
            let p2 = new Superhero("Iron man", "Only Robert Downey Jr has played Iron Man");
            let p3 = new Superhero("Hulk", "Stan Lee got the idea by combining the tragic monster from Frankenstein with the split personality of Dr. Jekyll and Mr. Hyde");

            let p4 = new Superhero("Dad", "He's my Superhero irl");

            document.getElementById("card1").innerHTML =
                "<div class='card'><div class='superhero-name'>" +
                p1.name +
                "</div>" +
                "<divclass='superherofact'>" +
                p1.describe() +
                "</div></div>";

            document.getElementById("card2").innerHTML =
                "<div class='card'><div class='superhero-name'>" +
                p2.name +
                "</div>" +
                "<divclass='superherofact'>" +
                p2.describe() +
                "</div></div>";

            document.getElementById("card3").innerHTML =
                "<div class='card'><div class='superhero-name'>" +
                p3.name +
                "</div>" +
                "<divclass='superherofact'>" +
                p3.describe() +
                "</div></div>";

                document.getElementById("card3").innerHTML =
                "<div class='card'><div class='superhero-name'>" +
                p4.name +
                "</div>" +
                "<divclass='superherofact'>" +
                p4.describe() +
                "</div></div>";
        }
    </script>
</body>

</html>
